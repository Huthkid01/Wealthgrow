<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Grow</title>
    <link rel="stylesheet" href="styles.css">
<body>
    <!-- Page Loader - shown immediately -->
    <div id="page-loader">
        <div class="page-loader-overlay">
            <div class="page-loader-content">
                <div class="page-loader-spinner">
                    <div class="spinner-ring"></div>
                    <div class="spinner-ring"></div>
                    <div class="spinner-ring"></div>
                    <div class="spinner-ring"></div>
                </div>
                <div class="page-loader-text">Loading Wealth Grow...</div>
                <div class="page-loader-progress">
                    <div class="progress-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <header>
        <nav>
            <div class="logo">Wealth Grow</div>
            <div class="nav-right">
                <div class="language-selector">
                    <button class="lang-btn" id="current-lang">
                        <i class="fas fa-globe"></i>
                        <span>EN</span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="lang-dropdown" id="lang-dropdown">
                        <a href="#" class="lang-option" data-lang="en">
                            <span class="flag">🇺🇸</span>
                            <span class="lang-text">English</span>
                        </a>
                        <a href="#" class="lang-option" data-lang="ms">
                            <span class="flag">🇲🇾</span>
                            <span class="lang-text">Bahasa Melayu</span>
                        </a>
                        <a href="#" class="lang-option" data-lang="ta">
                            <span class="flag">🇮🇳</span>
                            <span class="lang-text">தமிழ் (Tamil)</span>
                        </a>
                    </div>
                </div>
                <div class="hamburger" id="hamburger">
                    <svg class="hamburger-svg" viewBox="0 0 24 24" width="24" height="24">
                        <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" fill="#FFD700"/>
                    </svg>
                    <svg class="x-icon" viewBox="0 0 24 24" width="24" height="24">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z" fill="#FFD700"/>
                    </svg>
                </div>
            </div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="help.html">Help</a></li>
            </ul>
        </nav>
        <div class="mobile-menu" id="mobile-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="help.html">Help</a></li>
            </ul>
        </div>
    </header>
    <main>
        <section class="login-section">
            <h1>Login to Your Account</h1>
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <div class="password-container">
                        <input type="password" id="password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePassword('password')">👁️</button>
                    </div>
                </div>
                <div class="form-group remember-me-group">
                    <label class="remember-me-label">
                        <input type="checkbox" id="remember-me">
                        <span class="remember-me-text">Remember me</span>
                    </label>
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p id="error-message" class="error"></p>
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="login.html">Login</a>
                <a href="help.html">Help</a>
            </div>
            <p>&copy; <span id="current-year"></span> Wealth Grow. All rights reserved.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
